version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: samvad-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: samvad
    networks:
      - samvad-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samvad-backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/samvad
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
    networks:
      - samvad-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: samvad-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5001
    depends_on:
      - backend
    networks:
      - samvad-network

volumes:
  mongodb_data:
    driver: local

networks:
  samvad-network:
    driver: bridge
